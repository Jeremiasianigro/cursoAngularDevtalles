<div class="card bg-base-100 shadow-sm animate-fade-in-scale">
  <figure>
    <img
      [src]="product().images | productImage"
      [alt]="product().title" />
  </figure>
  <div class="card-body">
    <a

    [routerLink]="['/product',product().slug]"
    class="card-title font-montserrat text-lg link link-accent">{{ product().title }}</a>
    <p>{{product().description | slice : 0:70}} ...</p>
    <div class="card-actions justify-end">
      <a
      class="link link-accent"
      [routerLink]="['/product',product().slug]"
      >
      Ver producto</a>
    </div>
  </div>
</div>
